services:
  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "9092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 4
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 15s
      retries: 5
      start_period: 15s

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  jobmanager:
    image: flink:2.0.2-java21
    ports:
      - "8081:8081"
      - "9249:9249"
    command: jobmanager
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ICEBERG_ENABLED: ${ICEBERG_ENABLED:-false}
      MINIO_ENDPOINT: http://s3:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-password123}
      ENABLE_BUILT_IN_PLUGINS: flink-s3-fs-hadoop-2.0.2.jar
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 4
        parallelism.default: 4
        state.backend.type: rocksdb
        state.checkpoints.dir: s3a://warehouse/flink-checkpoints
        s3.endpoint: http://s3:9000
        s3.access-key: ${MINIO_ROOT_USER:-admin}
        s3.secret-key: ${MINIO_ROOT_PASSWORD:-password123}
        s3.path.style.access: true
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
    volumes:
      - flink_data:/opt/flink/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/overview > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      s3-init:
        condition: service_completed_successfully

  taskmanager:
    image: flink:2.0.2-java21
    command: taskmanager
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ICEBERG_ENABLED: ${ICEBERG_ENABLED:-false}
      MINIO_ENDPOINT: http://s3:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-password123}
      ENABLE_BUILT_IN_PLUGINS: flink-s3-fs-hadoop-2.0.2.jar
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 4
        parallelism.default: 4
        state.backend.type: rocksdb
        state.checkpoints.dir: s3a://warehouse/flink-checkpoints
        s3.endpoint: http://s3:9000
        s3.access-key: ${MINIO_ROOT_USER:-admin}
        s3.secret-key: ${MINIO_ROOT_PASSWORD:-password123}
        s3.path.style.access: true
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
    depends_on:
      jobmanager:
        condition: service_healthy

  # Stockage objet compatible S3 pour le warehouse Iceberg et les checkpoints.
  #
  # Anciennement MinIO. Les images minio/minio et minio/mc ont ete retirees des
  # registres publics — Docker Hub comme quay.io, y compris les tags RELEASE.*
  # precis — ce qui empechait tout nouveau clone de demarrer le projet.
  # SeaweedFS expose la meme API S3 et reste publiquement disponible.
  #
  # Le port S3 est force sur 9000 pour que les endpoints restent inchanges.
  #
  # SeaweedFS rejette toute requete SIGNEE tant qu'aucune configuration
  # d'authentification n'existe :
  #   S3Exception: Signed request requires setting up SeaweedFS S3
  #   authentication (Status Code: 400)
  # Or le client S3A de Hadoop signe systematiquement. On genere donc la
  # configuration au demarrage depuis les variables d'environnement, ce qui
  # garde une source unique pour les identifiants et rend le stockage local
  # reellement authentifie.
  s3:
    image: chrislusf/seaweedfs:3.80
    ports:
      - "9000:9000"
      - "8888:8888"
    environment:
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-admin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-password123}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mkdir -p /etc/seaweedfs
        cat > /etc/seaweedfs/s3.json <<EOF
        {
          "identities": [
            {
              "name": "$${S3_ACCESS_KEY}",
              "credentials": [
                {
                  "accessKey": "$${S3_ACCESS_KEY}",
                  "secretKey": "$${S3_SECRET_KEY}"
                }
              ],
              "actions": ["Admin", "Read", "Write", "List", "Tagging"]
            }
          ]
        }
        EOF
        exec weed server -s3 -s3.port=9000 \
          -s3.config=/etc/seaweedfs/s3.json \
          -dir=/data -master.volumeSizeLimitMB=1024
    volumes:
      - s3_data:/data

  # Cree le bucket warehouse. L'image SeaweedFS n'embarque pas de client, et
  # pas de curl pour un healthcheck : l'attente se fait donc ici, par reessai.
  s3-init:
    image: amazon/aws-cli:2.22.35
    depends_on:
      s3:
        condition: service_started
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-admin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-password123}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint:
      - /bin/sh
      - -c
      - |
        for i in $$(seq 1 60); do
          if aws --endpoint-url http://s3:9000 s3 ls > /dev/null 2>&1; then
            echo "S3 pret apres $${i}x2s"
            aws --endpoint-url http://s3:9000 s3 mb s3://warehouse 2>/dev/null \
              && echo "bucket warehouse cree" \
              || echo "bucket warehouse deja present"
            exit 0
          fi
          sleep 2
        done
        echo "S3 injoignable" >&2
        exit 1

  iceberg-rest:
    image: tabulario/iceberg-rest:1.6.0
    ports:
      - "8181:8181"
    environment:
      CATALOG_WAREHOUSE: s3a://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://s3:9000
      CATALOG_S3_PATH_STYLE_ACCESS: "true"
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-admin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-password123}
      AWS_REGION: us-east-1
    depends_on:
      s3-init:
        condition: service_completed_successfully

  prometheus:
    image: prom/prometheus:v3.1.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    depends_on:
      jobmanager:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.5.2
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus

volumes:
  kafka_data:
  flink_data:
  s3_data:
  prometheus_data:
  grafana_data:
